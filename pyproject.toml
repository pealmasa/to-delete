[project]
name = "project-name"
version = "0.1.0"
description = ""
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.3",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.0.0",
    "psycopg2-binary>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pip-audit>=2.10.0",
]

llm = [
    # >=1.83.0 skips supply-chain-attacked 1.82.7/1.82.8 (see issue #57 / fix/pin-litellm-supply-chain)
    # <2 signals intent to review before major version jump
    "litellm>=1.83.4,<2",
    "langfuse>=2.0.0",
    "opentelemetry-sdk>=1.24.0",
    "langchain>=0.2.0",
    "langgraph>=0.1.0",
    "instructor>=1.15.1",
]

# ─────────────────────────────────────────────
# Ruff — Linting & Formatting
# ─────────────────────────────────────────────
[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "SIM", "TCH", "S"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]
"**/cli.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"

# ─────────────────────────────────────────────
# Mypy — Type Checking
# ─────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

# ─────────────────────────────────────────────
# Pytest — Testing
# ─────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=80"
