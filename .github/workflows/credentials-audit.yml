name: Credentials Audit

# Auditoria semanal — segunda-feira às 08h00
# Verifica expiração de secrets e abre Issues com urgência
on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:  # Permite trigger manual pelo CTO ou Sam

jobs:
  audit:
    name: Auditar Credenciais
    runs-on: ubuntu-latest
    steps:
      # ─── STUDIO_ADMIN_TOKEN self-check ───────────────────────────────────────
      # STUDIO_ADMIN_TOKEN has a fixed name (no _EXP_ suffix) so it is excluded
      # from the generic _EXP_ loop below.  We check it separately via the
      # STUDIO_ADMIN_TOKEN_EXPIRY variable (set it to YYYYMMDD in repo Variables
      # whenever the token is renewed — Settings → Secrets and variables → Variables).
      - name: Verificar expiração do STUDIO_ADMIN_TOKEN
        id: token_self_check
        env:
          TOKEN_EXPIRY: ${{ vars.STUDIO_ADMIN_TOKEN_EXPIRY }}
          GH_TOKEN: ${{ secrets.STUDIO_ADMIN_TOKEN }}
        run: |
          if [ -z "$TOKEN_EXPIRY" ]; then
            echo "⚠️ STUDIO_ADMIN_TOKEN_EXPIRY não está definida como GitHub Variable."
            echo "   Definir em Settings → Secrets and variables → Variables com formato YYYYMMDD."
            echo "token_status=missing" >> "$GITHUB_OUTPUT"
          else
            TODAY=$(date +%Y%m%d)
            CRITICAL_DATE=$(date -d "+7 days" +%Y%m%d)
            WARN_DATE=$(date -d "+30 days" +%Y%m%d)

            if [ "$TOKEN_EXPIRY" -le "$TODAY" ]; then
              echo "🚨 STUDIO_ADMIN_TOKEN já expirou ($TOKEN_EXPIRY) — auditoria inoperacional!"
              echo "token_status=expired" >> "$GITHUB_OUTPUT"
            elif [ "$TOKEN_EXPIRY" -le "$CRITICAL_DATE" ]; then
              DAYS_LEFT=$(( ($(date -d "$TOKEN_EXPIRY" +%s) - $(date +%s)) / 86400 ))
              echo "🚨 STUDIO_ADMIN_TOKEN expira em $DAYS_LEFT dias ($TOKEN_EXPIRY)"
              echo "token_status=critical" >> "$GITHUB_OUTPUT"
              echo "token_days=$DAYS_LEFT" >> "$GITHUB_OUTPUT"
            elif [ "$TOKEN_EXPIRY" -le "$WARN_DATE" ]; then
              DAYS_LEFT=$(( ($(date -d "$TOKEN_EXPIRY" +%s) - $(date +%s)) / 86400 ))
              echo "⚠️ STUDIO_ADMIN_TOKEN expira em $DAYS_LEFT dias ($TOKEN_EXPIRY)"
              echo "token_status=warning" >> "$GITHUB_OUTPUT"
              echo "token_days=$DAYS_LEFT" >> "$GITHUB_OUTPUT"
            else
              echo "✅ STUDIO_ADMIN_TOKEN OK — expira em $TOKEN_EXPIRY"
              echo "token_status=ok" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Abrir Issue — STUDIO_ADMIN_TOKEN crítico ou expirado
        if: |
          steps.token_self_check.outputs.token_status == 'critical' ||
          steps.token_self_check.outputs.token_status == 'expired' ||
          steps.token_self_check.outputs.token_status == 'missing'
        env:
          GH_TOKEN: ${{ secrets.STUDIO_ADMIN_TOKEN }}
        run: |
          STATUS="${{ steps.token_self_check.outputs.token_status }}"
          DAYS="${{ steps.token_self_check.outputs.token_days }}"
          EXPIRY="${{ vars.STUDIO_ADMIN_TOKEN_EXPIRY }}"

          if [ "$STATUS" = "expired" ]; then
            TITLE="🚨 [SECURITY] STUDIO_ADMIN_TOKEN EXPIROU — auditoria inoperacional"
            BODY="O \`STUDIO_ADMIN_TOKEN\` expirou em \`$EXPIRY\`. A auditoria de credenciais está inoperacional.\n\n**Acção imediata:** Renovar o token e actualizar o secret + a variable \`STUDIO_ADMIN_TOKEN_EXPIRY\`."
          elif [ "$STATUS" = "missing" ]; then
            TITLE="⚠️ [SECURITY] STUDIO_ADMIN_TOKEN_EXPIRY não configurada"
            BODY="A variable \`STUDIO_ADMIN_TOKEN_EXPIRY\` não está definida — impossível monitorizar a expiração do \`STUDIO_ADMIN_TOKEN\`.\n\nDefinir em **Settings → Secrets and variables → Variables** com o valor \`YYYYMMDD\` da data de expiração do token."
          else
            TITLE="🚨 [SECURITY] STUDIO_ADMIN_TOKEN expira em ${DAYS} dias"
            BODY="O \`STUDIO_ADMIN_TOKEN\` expira em **${DAYS} dias** (\`$EXPIRY\`).\n\nRenovar antes da expiração para evitar falha da auditoria de credenciais."
          fi

          existing=$(gh issue list \
            --repo "${{ github.repository }}" \
            --label "security" \
            --state open \
            --search "STUDIO_ADMIN_TOKEN" \
            --json number -q '.[0].number')

          if [ -z "$existing" ]; then
            gh issue create \
              --repo "${{ github.repository }}" \
              --title "$TITLE" \
              --label "security" \
              --assignee "helostudio-sam-oliveira" \
              --body "$(printf '%b' "$BODY")"
          else
            gh issue comment "$existing" \
              --repo "${{ github.repository }}" \
              --body "🔁 **Auditoria $(date +%Y-%m-%d)** — $(printf '%b' "$BODY")"
          fi

      # ─────────────────────────────────────────────────────────────────────────
      - name: Auditar secrets com sufixo _EXP_
        id: audit
        env:
          GH_TOKEN: ${{ secrets.STUDIO_ADMIN_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          TODAY=$(date +%Y%m%d)
          WARN_DATE=$(date -d "+30 days" +%Y%m%d)
          CRITICAL_DATE=$(date -d "+7 days" +%Y%m%d)

          CRITICAL_SECRETS=""
          WARNING_SECRETS=""
          MISSING_EXP=""

          # Listar todos os secrets do repo
          # Falha explicitamente se o token não tiver scopes correctos — evita falso green silencioso
          secrets=$(gh secret list --repo "$REPO" --json name -q '.[].name') || {
            echo "❌ Falha ao listar secrets — verificar scopes do STUDIO_ADMIN_TOKEN (necessário: repo full)"
            exit 1
          }

          for secret in $secrets; do
            # Verificar secrets que têm _EXP_ no nome
            if echo "$secret" | grep -q "_EXP_"; then
              # Extrair data de expiração (formato: SECRET_NAME_EXP_YYYYMMDD)
              exp_date=$(echo "$secret" | grep -oP '\d{8}$')

              if [ -n "$exp_date" ]; then
                if [ "$exp_date" -le "$CRITICAL_DATE" ]; then
                  CRITICAL_SECRETS="${CRITICAL_SECRETS}"$'\n'"- \`$secret\` — expira em ${exp_date}"
                elif [ "$exp_date" -le "$WARN_DATE" ]; then
                  WARNING_SECRETS="${WARNING_SECRETS}"$'\n'"- \`$secret\` — expira em ${exp_date}"
                fi
              fi
            # Verificar secrets sem _EXP_ que deveriam ter (API keys, tokens)
            # Excepções:
            #   _PERMANENT         — secret explicitamente declarado como sem expiração (convenção do studio)
            #   GITHUB             — GITHUB_TOKEN gerido automaticamente pelo GitHub Actions
            #   STUDIO_ADMIN_TOKEN — token de serviço do workflow; nome fixo por referência directa no workflow
            elif echo "$secret" | grep -qE "(API_KEY|TOKEN|SECRET|PASSWORD)"; then
              if ! echo "$secret" | grep -qE "(_PERMANENT$|GITHUB|STUDIO_ADMIN_TOKEN)"; then
                MISSING_EXP="${MISSING_EXP}"$'\n'"- \`$secret\` — sem data de expiração"
              fi
            fi
          done

          # Usar formato heredoc para outputs multiline — evita truncagem em $GITHUB_OUTPUT
          {
            echo "critical<<AUDIT_DELIM"
            echo "$CRITICAL_SECRETS"
            echo "AUDIT_DELIM"
          } >> "$GITHUB_OUTPUT"

          {
            echo "warning<<AUDIT_DELIM"
            echo "$WARNING_SECRETS"
            echo "AUDIT_DELIM"
          } >> "$GITHUB_OUTPUT"

          {
            echo "missing_exp<<AUDIT_DELIM"
            echo "$MISSING_EXP"
            echo "AUDIT_DELIM"
          } >> "$GITHUB_OUTPUT"

          # Definir nível de urgência
          if [ -n "$CRITICAL_SECRETS" ]; then
            echo "level=critical" >> "$GITHUB_OUTPUT"
          elif [ -n "$WARNING_SECRETS" ] || [ -n "$MISSING_EXP" ]; then
            echo "level=warning" >> "$GITHUB_OUTPUT"
          else
            echo "level=ok" >> "$GITHUB_OUTPUT"
          fi

      # ─── Deduplicação: Critical ───────────────────────────────────────────────
      - name: Verificar Issue crítica em aberto
        if: steps.audit.outputs.level == 'critical'
        id: check_critical
        env:
          GH_TOKEN: ${{ secrets.STUDIO_ADMIN_TOKEN }}
        run: |
          existing=$(gh issue list \
            --repo "${{ github.repository }}" \
            --label "security" \
            --state open \
            --search "Secrets críticos a expirar" \
            --json number -q '.[0].number')
          echo "existing=$existing" >> "$GITHUB_OUTPUT"

      - name: Abrir Issue de alerta (Critical — nova)
        if: steps.audit.outputs.level == 'critical' && steps.check_critical.outputs.existing == ''
        env:
          GH_TOKEN: ${{ secrets.STUDIO_ADMIN_TOKEN }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "🚨 [SECURITY] Secrets críticos a expirar em menos de 7 dias" \
            --label "security" \
            --assignee "helostudio-sam-oliveira" \
            --body "## Auditoria de Credenciais — $(date +%Y-%m-%d)

          ### 🚨 CRÍTICO — Expiram em menos de 7 dias

          ${{ steps.audit.outputs.critical }}

          **Acção imediata:** Renovar e actualizar estes secrets antes da expiração.

          ### ⚠️ Atenção — Expiram em menos de 30 dias

          ${{ steps.audit.outputs.warning }}

          ### 🔍 Sem data de expiração (rever)

          ${{ steps.audit.outputs.missing_exp }}

          ---
          *Gerado automaticamente pelo workflow credentials-audit.yml*"

      - name: Comentar em Issue crítica existente
        if: steps.audit.outputs.level == 'critical' && steps.check_critical.outputs.existing != ''
        env:
          GH_TOKEN: ${{ secrets.STUDIO_ADMIN_TOKEN }}
        run: |
          gh issue comment "${{ steps.check_critical.outputs.existing }}" \
            --repo "${{ github.repository }}" \
            --body "🔁 **Auditoria $(date +%Y-%m-%d) — ainda por resolver**

          Os seguintes secrets continuam em risco:

          ${{ steps.audit.outputs.critical }}

          Renovar antes da expiração."

      # ─── Deduplicação: Warning ────────────────────────────────────────────────
      - name: Verificar Issue de aviso em aberto
        if: steps.audit.outputs.level == 'warning'
        id: check_warning
        env:
          GH_TOKEN: ${{ secrets.STUDIO_ADMIN_TOKEN }}
        run: |
          existing=$(gh issue list \
            --repo "${{ github.repository }}" \
            --label "security" \
            --state open \
            --search "Secrets a expirar em menos de 30 dias" \
            --json number -q '.[0].number')
          echo "existing=$existing" >> "$GITHUB_OUTPUT"

      - name: Abrir Issue de alerta (Warning — nova)
        if: steps.audit.outputs.level == 'warning' && steps.check_warning.outputs.existing == ''
        env:
          GH_TOKEN: ${{ secrets.STUDIO_ADMIN_TOKEN }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "⚠️ [SECURITY] Secrets a expirar em menos de 30 dias" \
            --label "security" \
            --assignee "helostudio-sam-oliveira" \
            --body "## Auditoria de Credenciais — $(date +%Y-%m-%d)

          ### ⚠️ Expiram em menos de 30 dias

          ${{ steps.audit.outputs.warning }}

          ### 🔍 Sem data de expiração (rever)

          ${{ steps.audit.outputs.missing_exp }}

          ---
          *Gerado automaticamente pelo workflow credentials-audit.yml*"

      - name: Comentar em Issue de aviso existente
        if: steps.audit.outputs.level == 'warning' && steps.check_warning.outputs.existing != ''
        env:
          GH_TOKEN: ${{ secrets.STUDIO_ADMIN_TOKEN }}
        run: |
          gh issue comment "${{ steps.check_warning.outputs.existing }}" \
            --repo "${{ github.repository }}" \
            --body "🔁 **Auditoria $(date +%Y-%m-%d) — ainda por resolver**

          ${{ steps.audit.outputs.warning }}

          ${{ steps.audit.outputs.missing_exp }}"

      - name: Log — tudo OK
        if: steps.audit.outputs.level == 'ok'
        run: echo "✅ Auditoria concluída — nenhum secret em risco."
