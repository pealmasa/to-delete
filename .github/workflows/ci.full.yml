# FULL CI CONFIG — preserved for restoration
# To restore: cp .github/workflows/ci.full.yml .github/workflows/ci.yml
# This file only runs on manual dispatch to avoid consuming CI minutes.
name: CI

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─────────────────────────────
  # JOB 0 — PR title validation
  # ─────────────────────────────
  pr-title:
    name: PR Title Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title format
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          PATTERN='^(feat|fix|docs|style|refactor|test|chore|perf|ci)\(.+\)\[.+\]: .+$'
          if [[ ! "$PR_TITLE" =~ $PATTERN ]]; then
            echo "❌ PR title does not match required format."
            echo ""
            echo "Expected: <type>(<scope>)[<owner>]: <description>"
            echo "Got:      $PR_TITLE"
            echo ""
            echo "Valid types: feat, fix, docs, style, refactor, test, chore, perf, ci"
            echo ""
            echo "Examples:"
            echo "  feat(auth)[alex]: add JWT refresh token endpoint"
            echo "  fix(api)[zara]: handle null response on user endpoint"
            echo "  docs(changelog)[gil]: update CHANGELOG for #42"
            exit 1
          fi
          echo "✅ PR title format is valid: $PR_TITLE"

  # ─────────────────────────────
  # JOB 1 — Qualidade de código
  # ─────────────────────────────
  quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Instalar dependências
        run: uv sync --frozen --all-extras

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy .

  # ─────────────────────────────
  # JOB 2 — Testes e cobertura
  # ─────────────────────────────
  tests:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      APP_ENV: test
      SECRET_KEY: test-secret-key-not-used-in-production
      LANGFUSE_SECRET_KEY: test-secret
      LANGFUSE_PUBLIC_KEY: test-public
      LANGFUSE_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Instalar dependências
        run: uv sync --frozen --all-extras

      - name: Correr testes com cobertura
        run: uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=80

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: htmlcov/

  # ─────────────────────────────
  # JOB 3 — Security scan
  # ─────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: pr-title
    if: always() && github.event_name == 'pull_request' && (needs.pr-title.result == 'success' || needs.pr-title.result == 'skipped')
    steps:
      - uses: actions/checkout@v6

      # Semgrep runs its own container — no Python deps needed
      - name: Semgrep SAST
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/python
            p/owasp-top-ten
            p/secrets
            p/jwt
            p/sql-injection

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Audit de dependências
        # uvx installs pip-audit in an isolated env — no uv sync needed.
        # Avoids the --no-install-workspace regression where pip-audit
        # (declared in [project.optional-dependencies].dev) is not installed.
        run: |
          uv export --frozen --no-hashes --all-extras --no-emit-project > /tmp/requirements.txt
          uvx pip-audit --strict -r /tmp/requirements.txt \
            --ignore-vuln CVE-2025-69872  # diskcache — no upstream fix available

  # ─────────────────────────────
  # JOB 4 — Notificação de falhas
  # ─────────────────────────────
  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [quality, tests, security]
    if: failure()
    permissions:
      contents: read
      issues: write
    steps:
      - name: Falha no Lint & Type Check
        if: needs.quality.result == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="CI: Lint & Type Check falhou — ${{ github.ref_name }}"
          existing=$(gh issue list \
            --repo "${{ github.repository }}" \
            --label "code-quality" \
            --state open \
            --search "$TITLE in:title" \
            --json number -q '.[0].number')
          BODY="**Branch:** \`${{ github.ref_name }}\`
          **Commit:** \`${{ github.sha }}\`
          **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          **O que verificar:**
          - Erros de ruff (lint ou format)
          - Erros de mypy (type annotations em falta ou incorrectas)

          Corrigir antes de fazer novo push."
          if [ -z "$existing" ]; then
            gh issue create \
              --repo "${{ github.repository }}" \
              --title "$TITLE" \
              --body "## Lint & Type Check falhou

          $BODY" \
              --label "code-quality" \
              --assignee "helostudio-alex-ferreira"
          else
            gh issue comment "$existing" \
              --repo "${{ github.repository }}" \
              --body "🔁 **Still failing** on commit \`${{ github.sha }}\`

          $BODY"
          fi

      - name: Falha nos Tests & Coverage
        if: needs.tests.result == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="CI: Tests & Coverage falhou — ${{ github.ref_name }}"
          existing=$(gh issue list \
            --repo "${{ github.repository }}" \
            --label "test" \
            --state open \
            --search "$TITLE in:title" \
            --json number -q '.[0].number')
          BODY="**Branch:** \`${{ github.ref_name }}\`
          **Commit:** \`${{ github.sha }}\`
          **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          **O que verificar:**
          - Testes a falhar — ver log para detalhes
          - Cobertura abaixo de 80% — adicionar testes aos módulos em falta

          Rita: verificar e corrigir."
          if [ -z "$existing" ]; then
            gh issue create \
              --repo "${{ github.repository }}" \
              --title "$TITLE" \
              --body "## Tests & Coverage falhou

          $BODY" \
              --label "test" \
              --assignee "helostudio-rita-sousa"
          else
            gh issue comment "$existing" \
              --repo "${{ github.repository }}" \
              --body "🔁 **Still failing** on commit \`${{ github.sha }}\`

          $BODY"
          fi

      - name: Falha no Security Scan
        if: needs.security.result == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="CI: Security Scan falhou — ${{ github.ref_name }}"
          existing=$(gh issue list \
            --repo "${{ github.repository }}" \
            --label "security" \
            --state open \
            --search "$TITLE in:title" \
            --json number -q '.[0].number')
          BODY="**Branch:** \`${{ github.ref_name }}\`
          **Commit:** \`${{ github.sha }}\`
          **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          **O que verificar:**
          - Vulnerabilidades detectadas pelo Semgrep
          - CVEs em dependências detectados pelo pip-audit

          > ⚠️ @CTO — falha de segurança detectada. Verificar antes de qualquer merge.

          Sam: analisar e actuar conforme \`security-audit.md\`."
          if [ -z "$existing" ]; then
            gh issue create \
              --repo "${{ github.repository }}" \
              --title "$TITLE" \
              --body "## Security Scan falhou

          $BODY" \
              --label "security" \
              --assignee "helostudio-sam-oliveira"
          else
            gh issue comment "$existing" \
              --repo "${{ github.repository }}" \
              --body "🔁 **Still failing** on commit \`${{ github.sha }}\`

          $BODY"
          fi
