name: Deploy — Staging

# Trigger: merge para develop
on:
  push:
    branches: [develop]
    paths-ignore:
      - "docs/**"
      - "*.md"

# ⏸ PENDENTE — aguarda VPS Hetzner (Fase 1.6 do helo-05)
#
# Pré-requisitos antes de activar:
#   1. VPS Hetzner provisionado
#   2. Docker registry configurado (GitHub Container Registry ou outro)
#   3. Secrets configurados na org do cliente:
#      - VPS_HOST         → IP ou domínio do VPS
#      - VPS_SSH_KEY      → chave SSH privada para acesso ao VPS
#      - REGISTRY_TOKEN   → token de acesso ao container registry
#
# Para activar: remover o 'if: false' do job abaixo

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: false  # ← remover quando VPS estiver provisionado
    environment:
      name: staging
      url: https://staging.${{ vars.CLIENT_DOMAIN }}

    steps:
      - uses: actions/checkout@v6

      - name: Login no container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build e push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:staging
            ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Deploy para VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/staging/${{ github.event.repository.name }}
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
            echo "Deploy staging concluído: ${{ github.sha }}"

      - name: Verificar deploy (healthcheck)
        run: |
          sleep 15
          curl -f https://staging.${{ vars.CLIENT_DOMAIN }}/health || exit 1
