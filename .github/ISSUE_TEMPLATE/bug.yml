name: "🐛 Bug Report"
description: "Reportar um bug"
labels: ["bug", "tier:senior"]
assignees: ["helostudio-alex-ferreira"]
body:
  - type: textarea
    id: description
    attributes:
      label: Descrição do bug
      description: O que acontece e o que era esperado
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Contexto adicional
      description: Logs, screenshots, ambiente
    validations:
      required: false
